name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Smoke test (editor boots and works in jsdom)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build artifact
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html не собран"; exit 1; }
          test -f dist/style.css || { echo "::error::dist/style.css не собран"; exit 1; }
          test "$(ls dist/js | wc -l)" -eq 8 || { echo "::error::dist/js должен содержать 8 скриптов"; exit 1; }
          echo "dist готов:"
          ls -R dist
